global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # otel-collector and node-exporter publish metrics on the host in Swarm mode
  - job_name: otel-collector
    static_configs:
      - targets: ["host.docker.internal:8889"]

  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
