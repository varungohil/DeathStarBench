version: "3.8"

# service-config.json uses 512 connections per downstream; default container nofile is 1024
x-sn-ulimits: &sn-ulimits
  nofile:
    soft: 65536
    hard: 65536

services:

  # Host PMU counters via --collector.perf. On each Swarm node, run once before deploy:
  #   sudo sysctl -w kernel.perf_event_paranoid=0
  node-exporter:
    image: prom/node-exporter:latest
    deploy:
      mode: global
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.perf"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - PERFMON
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: host

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: always
    deploy:
      mode: global
    command: ["--config=/etc/otelcol-collector-config.yml"]
    volumes:
      - ./config/otel-collector-config.yml:/etc/otelcol-collector-config.yml
      - /:/hostfs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
      - PERFMON
    ports:
      - target: 8889
        published: 8889
        protocol: tcp
        mode: host
    depends_on:
      - jaeger
      - node-exporter
    environment:
      - OTEL_COLLECTOR_PORT_GRPC=4317
      - OTEL_COLLECTOR_PORT_HTTP=4318

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus-swarm.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: host
    deploy:
      restart_policy:
        condition: any
    depends_on:
      - otel-collector
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    deploy:
      restart_policy:
        condition: any
    depends_on:
      - prometheus

  # jaeger:
  #   image: jaegertracing/jaeger:latest
  #   hostname: jaeger
  #   command: ["--reporter.grpc.host-port=jaeger:14250"]
  #   # ports:
  #   #   - target: 6831
  #   #     published: 6831
  #   #     protocol: udp
  #   #     mode: host
  #   #   - target: 5778
  #   #     published: 5778
  #   #     protocol: tcp
  #   #     mode: host
  #   #   - target: 14271
  #   #     published: 14271
  #   #     protocol: tcp
  #   #     mode: host
  #   deploy:
  #     restart_policy:
  #       condition: any
  #   depends_on:
  #     - jaeger

  compose-post-service:
    depends_on:
      - jaeger
      - jaeger-query
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    command: ["ComposePostService"]
    hostname: compose-post-service
    image: varungohil/sn-services-otel:latest
    ulimits: *sn-ulimits
    volumes:
      - ./config:/social-network-microservices/config
      - ./keys:/keys

  home-timeline-redis:
    depends_on:
      - jaeger
      - jaeger-query
    hostname: home-timeline-redis
    image: redis
    command: "redis-server /social-network-microservices/config/redis.conf"
    volumes:
      - ./config:/social-network-microservices/config
      - ./keys:/keys

  home-timeline-service:
