      - ./config:/social-network-microservices/config

  jaeger:
    image: jaegertracing/jaeger-collector
    command:
      [
        "--cassandra.keyspace=jaeger_v1_dc1",
        "--cassandra.servers=cassandra",
        "--collector.zipkin.host-port=9411",
        "--collector.num-workers=100",
        "--collector.queue-size=100000"
      ]
    ports:
      - "14269:14269"
    deploy:
      restart_policy:
        condition: any
    depends_on:
      - cassandra-schema

  jaeger-query:
    image: jaegertracing/jaeger-query
    command:
      ["--cassandra.keyspace=jaeger_v1_dc1", "--cassandra.servers=cassandra"]
    ports:
      - "16686:16686"
    deploy:
      restart_policy:
        condition: any
    depends_on:
      - cassandra-schema

  cassandra-schema:
    image: jaegertracing/jaeger-cassandra-schema
    deploy:
      restart_policy:
        condition: on-failure
    depends_on:
      - cassandra

  cassandra:
    image: cassandra:3.9
    deploy:



  frontend:
    image: varungohil/social-network-frontend-go-otel:latest
    ulimits: *sn-ulimits
    hostname: frontend
    ports:
      - 12345:12345
    depends_on:
      - jaeger
      - otel-collector
      - home-timeline-service
      - post-storage-service
      - user-timeline-service
      - user-service
      - compose-post-service
    restart: always
    environment:
      - FRONTEND_PORT=12345
      - FRONTEND_ADDR=localhost
      - LOG_LEVEL=info
    volumes:
      - ./config/service-config.json:/service-config.json
      - ./config/jaeger-config.yml:/jaeger-config.yml


networks:
  default:
    driver: overlay
    ipam:
      driver: default
      config:
        - subnet: 10.11.0.0/16
