receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  hostmetrics:
    root_path: /hostfs
    collection_interval: 10s
    scrapers:
      cpu: {}
      memory: {}
      load: {}
      network: {}
      disk: {}
      process:
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true

  prometheus:
    config:
      scrape_configs:
        - job_name: node-exporter-perf
          scrape_interval: 10s
          static_configs:
            # node-exporter publishes 9100 on the host (see compose files)
            - targets: ["host.docker.internal:9100"]

processors:
  batch: {}

exporters:
  otlp:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp]
    metrics:
      receivers: [hostmetrics, prometheus]
      processors: [batch]
      exporters: [debug, prometheus]
